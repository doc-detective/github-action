on: 
  # push:   # TODO: Uncomment this line to enable push events
  #   branches:
  #     - main
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  
  pass-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    name: Pass tests
    steps:
      - uses: actions/checkout@v4
      - name: Run Doc Detective
        uses: ./ # Uses an action in the root directory
        id: dd
        with:
          config: ./artifacts/.doc-detective.json
          input: ./artifacts/doc-content-inline-tests.md

  fail-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Fail tests
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Doc Detective
        uses: ./ # Uses an action in the root directory
        id: dd
        continue-on-error: true
        with:
          config: ./artifacts/.doc-detective.json
          input: ./artifacts/doc-content-inline-tests-fail.md
          exit_on_fail: true

      - name: Assert the failing fixture fails the action on a failed spec
        # A failed spec, not exit 2 (nothing tested) or a crash with no results.
        if: steps.dd.outcome != 'failure' || !steps.dd.outputs.results || fromJSON(steps.dd.outputs.results).summary.specs.fail < 1
        run: |
          echo "Expected the Doc Detective step to fail because a spec in the failing fixture failed."
          exit 1

  fail-tests-with-issue-mentions:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Fail tests with issue mentions
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Doc Detective
        uses: ./
        id: dd
        continue-on-error: true
        with:
          config: ./artifacts/.doc-detective.json
          input: ./artifacts/doc-content-inline-tests-fail.md
          exit_on_fail: true
          create_issue_on_fail: true
          issue_mentions: doc-sentinel,claude
          issue_prompt: "Investigate the failures and suggest fixes"
