on: 
  # push:   # TODO: Uncomment this line to enable push events
  #   branches:
  #     - main
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  
  pass-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    name: Pass tests
    steps:
      - uses: actions/checkout@v4
      - name: Run Doc Detective
        uses: ./ # Uses an action in the root directory
        id: dd
        with:
          version: v5-rc # Until 5.0.0 is on npm; `doc-detective@5` matches no prerelease. Drop at GA.
          config: ./artifacts/.doc-detective.json
          input: ./artifacts/doc-content-inline-tests.md

  fail-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: Fail tests
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Doc Detective
        uses: ./ # Uses an action in the root directory
        id: dd
        continue-on-error: true
        with:
          version: v5-rc # Until 5.0.0 is on npm; `doc-detective@5` matches no prerelease. Drop at GA.
          config: ./artifacts/.doc-detective.json
          input: ./artifacts/doc-content-inline-tests-fail.md
          exit_on_fail: true

      - name: Assert the failing fixture fails the action
        if: steps.dd.outcome != 'failure'
        run: |
          echo "Expected the Doc Detective step to fail on the failing fixture."
          exit 1

  fail-tests-with-integrations:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Fail tests with integrations
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Doc Detective
        uses: ./
        id: dd
        continue-on-error: true
        with:
          version: v5-rc # Until 5.0.0 is on npm; `doc-detective@5` matches no prerelease. Drop at GA.
          config: ./artifacts/.doc-detective.json
          input: ./artifacts/doc-content-inline-tests-fail.md
          exit_on_fail: true
          create_issue_on_fail: true
          integrations: doc-sentinel,claude
          prompt: "Investigate the failures and suggest fixes"
