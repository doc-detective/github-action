name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads every commit and tag since the last release.
          fetch-depth: 0
          # Both pushes below authenticate with GITHUB_TOKEN explicitly, so
          # the checkout token doesn't need to stay on disk.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # semantic-release 25 requires Node ^22.14.0 || >=24.10.0.
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Fail-safe: semantic-release derives the last version from git tags, not
      # package.json. With no baseline tag it would cut a "first release"
      # (v1.0.0) from full history, which already exists. Abort loudly instead
      # (covers both push and manual workflow_dispatch runs).
      - name: Ensure a baseline release tag exists
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            echo "::error::No baseline 'v*' git tag found. The baseline is v2.0.0. Fetch or restore it before releasing:"
            echo "::error::  git tag -a v2.0.0 -m 'v2.0.0' d4754e9 && git push origin v2.0.0"
            echo "::error::Without it, semantic-release would cut a regressing first release (v1.0.0)."
            exit 1
          fi

      # Cuts a release when a feat:, fix:, or breaking commit landed since the
      # last one: a vX.Y.Z tag and a GitHub release with generated notes. It
      # pushes no commits, because main requires pull requests and dist/ is
      # committed in the pull request (see ci.yml).
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # Workflows reference this action by floating tag (`@v2`, `@latest`), so
      # point both at each stable release: v2.3.1 moves v2 and latest.
      # semantic-release tags HEAD, so no stable tag there means no release was
      # cut. Only on main: a manual run against an old release tag would
      # otherwise find that tag at HEAD and move the floating tags back to it.
      - name: Move the major version and latest tags
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$version" ]; then
            echo "No stable release at HEAD. Leaving the major and latest tags alone."
            exit 0
          fi
          major="${version%%.*}"
          git tag -f "$major" HEAD
          git tag -f latest HEAD
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${major}" refs/tags/latest
          echo "Moved ${major} and latest to ${version}."
