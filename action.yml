name: Doc Detective
description: Treat doc content as testable assertions to validate doc accuracy and product UX.
author: Doc Detective
inputs:
  version:
    description: Specify the version of Doc Detective to use. This can be a specific version number, range, or NPM tag (like `latest`). This major of the action expects Doc Detective 5's exit codes. Set to an empty string ("") to run whatever `doc-detective` is already resolvable in the working directory (e.g. a locally-built checkout exposed via `npm link`) instead of installing from the registry — useful for a repo dog-fooding this action against its own build.
    required: false
    default: "5"
  working_directory:
    description: The directory to run the command in, relative to the root of the repository. Defaults to the root of the repository.
    required: false
    default: "."
  android:
    description: 'Enable Android emulator support on Linux runners by granting KVM access (the emulator needs hardware acceleration). "auto" (default) scans your specs and only sets up KVM when an android platform is present; "true" always sets it up; "false" never does. No effect on macOS/Windows runners, which can''t accelerate the emulator. Doc Detective bootstraps the SDK, emulator, system image, AVD, and driver itself at test time.'
    required: false
    default: auto
  config:
    description: Path to the configuration file. Relative to `working_directory`.
    required: false
  input:
    description: Path to the input file or directory. Overrides the "input" field in the config file. Relative to `working_directory`.
    required: false
  create_pr_on_change:
    description: Create a pull request if any files in the repo change, such as if screenshots or command results get updated. Default is "false".
    required: false
    default: "false"
  pr_branch:
    description: The name of the branch to create for the pull request. Defaults to `doc-detective-<timestamp>`, where `<timestamp>` is the time in milliseconds since the Unix epoch. Only valid if "create_pr_on_change" is set to "true".
    required: false
  pr_title:
    description: The title of the created pull request. Only valid if "create_pr_on_change" is set to "true".
    required: false
    default: "Doc Detective Changes"
  pr_body:
    description: The body of the created pull request. `$RUN_URL` inserts the URL of the workflow run that created the pull request. Only valid if "create_pr_on_change" is set to "true".
    required: false
    default: |
      A Doc Detective run ($RUN_URL) updated files.

      DISCLAIMER: This pull request doesn't reflect whether Doc Detective tests passed or failed, only that files in the repository changed. Review the changes to make sure they're accurate.
  pr_labels:
    description: Comma-separated list of labels to apply to the pull request. Only valid if "create_pr_on_change" is set to "true".
    required: false
    default: "doc-detective"
  pr_assignees:
    description: Comma-separated list of GitHub usernames to assign to the pull request. Only valid if "create_pr_on_change" is set to "true".
    required: false
    default: ""
  pr_reviewers:
    description: Comma-separated list of GitHub usernames to request reviews from for the pull request. Only valid if "create_pr_on_change" is set to "true".
    required: false
    default: ""
  exit_on_fail:
    description: Fail the job if one or more tests fails. Default is "true". If "false", a failing test leaves the job green. Whatever this is set to, the job fails when nothing valid was tested, Doc Detective couldn't proceed, or it didn't write results. The results, issue, and pull request steps run first whenever Doc Detective writes results.
    required: false
    default: "true"
  create_issue_on_fail:
    description: File a GitHub issue if one or more tests fails. If an open issue has the same `issue_title` and the first of `issue_labels`, the action replaces that issue's body instead of opening another. Default is "false".
    required: false
    default: "false"
  issue_title:
    description: The title of the created GitHub issue. Only valid if "create_issue_on_fail" is set to "true".
    required: false
    default: "Doc Detective Failure"
  issue_body:
    description: The body of the created GitHub issue. `$SUMMARY` inserts the Markdown summary Doc Detective wrote to the run folder (`testResults.md`). `$RESULTS` inserts the results object as JSON. Both get cut to fit GitHub's 65,536-character limit on issue bodies, with a link to the run when they're cut. `$RUN_URL` inserts the URL of the workflow that created the issue. `$PROMPT` inserts the `issue_prompt` text. Only valid if "create_issue_on_fail" is set to "true".
    required: false
    default: |-
      A Doc Detective run ($RUN_URL) failed:

      $SUMMARY
  issue_labels:
    description: Comma-separated list of labels to apply to the GitHub issue. Only valid if "create_issue_on_fail" is set to "true".
    required: false
    default: "doc-detective"
  issue_assignees:
    description: Comma-separated list of GitHub usernames to assign to the GitHub issue. Only valid if "create_issue_on_fail" is set to "true".
    required: false
    default: ""
  issue_mentions:
    description: >-
      Comma-separated list of tools to mention in the created GitHub issue. Each one gets a mention or command, with `issue_prompt` where the tool takes one, in a collapsible "AI issue mentions" section appended to the issue body.

      Supported values: "doc-sentinel", "promptless", "dosu", "claude", "opencode", "copilot", "cursor". Invalid values are ignored with a warning.

      "copilot" assigns the issue to Copilot instead of adding a mention.

      Only valid if "create_issue_on_fail" is set to "true".
    required: false
    default: ""
  issue_prompt:
    description: >-
      The text that follows each mention from `issue_mentions`. For example, if `issue_mentions` is `claude`, the issue includes "@claude <issue_prompt>". `$PROMPT` inserts it in `issue_body`.
      Defaults to `Investigate potential causes of the failures reported in this Doc Detective test output and suggest fixes.`

      Only valid if "create_issue_on_fail" is set to "true".
    required: false
  integrations:
    description: "Deprecated: use `issue_mentions`."
    required: false
  prompt:
    description: "Deprecated: use `issue_prompt`."
    required: false
  token:
    description: The GitHub token to use for creating issues. Defaults to the token already available to the GitHub Action workflow. Only set this if you want to override the default token.
    required: false
    default: ${{ github.token }}
outputs:
  results:
    description: JSON-formatted results of the command.
  issue_url:
    description: URL of the created or updated GitHub issue. Only set if `create_issue_on_fail` is "true" and a test failed.
  pull_request_url:
    description: URL of the created pull request. Only set if `create_pr_on_change` is "true" and files changed.
runs:
  using: node24 # Specifies the node version
  main: dist/index.js # Path to the JavaScript file that will be executed
branding:
  icon: search # The icon to display in the GitHub Marketplace
  color: green # The color of the branding